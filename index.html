<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08111A">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2308111A'/><text y='.88em' font-size='64' x='50%' text-anchor='middle' font-family='system-ui' font-weight='900' fill='%230EA5FF'>T</text></svg>">
<title>Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────
   RESET
───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;border:none;background:none;cursor:pointer;-webkit-appearance:none}
input,textarea{font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ─────────────────────────────────────────
   TOKENS
───────────────────────────────────────── */
:root{
  --ff:'DM Sans',system-ui,sans-serif;
  --ff-mono:'DM Mono',monospace;

  /* spacing — 4px base unit */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:28px;--s8:32px;

  /* type */
  --t-2xs:9px;--t-xs:11px;--t-sm:13px;--t-base:15px;--t-md:17px;--t-lg:21px;--t-xl:27px;--t-2xl:36px;

  /* radius */
  --r2:2px;--r4:4px;--r6:6px;--r8:8px;--r12:12px;--r16:16px;--r20:20px;--r24:24px;--rpill:999px;

  /* easing */
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(0,0,.2,1);

  /* workout palette */
  --rest:#FF9500;
  --push:#0EA5FF;
  --pull:#8B5CF6;
  --legs:#10B981;
  --upper:#F43F5E;
  --abs:#06B6D4;
}

/* ─────────────────────────────────────────
   LIGHT THEME
───────────────────────────────────────── */
body{
  --bg:#F2F5FA;
  --bg2:#E8ECF3;
  --bg3:#DDE3ED;
  --card:#FFFFFF;
  --card2:#F8FAFD;
  --shell:#08111A;
  --shell2:#0F1E2E;
  --shell3:#162840;
  --border:rgba(15,30,60,.08);
  --border2:rgba(15,30,60,.14);
  --t1:#0D1B2A;
  --t2:#3B526B;
  --t3:#7A96AE;
  --t4:#B8CCDA;
  --accent:#0EA5FF;
  --accent-dim:rgba(14,165,255,.12);
  --accent-glow:rgba(14,165,255,.25);
  --green:#10B981;--green-dim:rgba(16,185,129,.12);
  --red:#F43F5E;--red-dim:rgba(244,63,94,.12);
  --orange:#FF9500;
  --sh1:0 1px 3px rgba(13,27,42,.06),0 1px 2px rgba(13,27,42,.04);
  --sh2:0 4px 12px rgba(13,27,42,.08),0 2px 6px rgba(13,27,42,.05);
  --sh3:0 8px 24px rgba(13,27,42,.10),0 4px 10px rgba(13,27,42,.06);
  --picker-fade:#FFFFFF;
  background:var(--bg);color:var(--t1);font-family:var(--ff);
}

/* ─────────────────────────────────────────
   DARK THEME
───────────────────────────────────────── */
body.dark{
  --bg:#070E17;
  --bg2:#0C1520;
  --bg3:#111D2B;
  --card:#0F1C2B;
  --card2:#132030;
  --shell:#040A12;
  --shell2:#061018;
  --shell3:#081520;
  --border:rgba(255,255,255,.06);
  --border2:rgba(255,255,255,.11);
  --t1:#E8F0F8;
  --t2:#7A9AB8;
  --t3:#3D607A;
  --t4:#1E3A50;
  --sh1:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --sh2:0 4px 12px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.2);
  --sh3:0 8px 24px rgba(0,0,0,.4),0 4px 10px rgba(0,0,0,.25);
  --picker-fade:#0F1C2B;
  background:var(--bg);color:var(--t1);
}

/* ─────────────────────────────────────────
   SHELL
───────────────────────────────────────── */
#app{min-height:100vh;padding-bottom:96px}

/* ─────────────────────────────────────────
   HEADER
───────────────────────────────────────── */
.hdr{
  background:var(--shell);
  padding:env(safe-area-inset-top) var(--s4) 0;
  padding-top:calc(env(safe-area-inset-top) + 44px);
  position:sticky;top:0;z-index:200;
}
.hdr-inner{padding:var(--s3) 0 var(--s3)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s1)}
.hdr-title{font-size:var(--t-lg);font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1}
.hdr-meta{font-size:var(--t-2xs);color:rgba(255,255,255,.28);letter-spacing:.08em;text-transform:uppercase;margin-top:var(--s1)}
.hdr-btn{
  width:34px;height:34px;border-radius:var(--r8);
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:background 120ms;border:1px solid rgba(255,255,255,.08);
}
.hdr-btn:active{background:rgba(255,255,255,.14)}

/* Segmented tabs */
.seg{display:flex;gap:2px;background:rgba(255,255,255,.04);border-radius:var(--r12);padding:3px;margin-top:var(--s3)}
.seg-tab{
  flex:1;padding:8px var(--s2);border-radius:var(--r8);
  font-size:var(--t-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:rgba(255,255,255,.3);text-align:center;
  transition:all 180ms var(--ease);cursor:pointer;
}
.seg-tab.on{
  background:var(--accent);color:#fff;
  box-shadow:0 2px 10px rgba(14,165,255,.35);
}

/* ─────────────────────────────────────────
   TODAY CARD
───────────────────────────────────────── */
.today{
  margin:var(--s4) var(--s4) 0;
  background:linear-gradient(135deg,var(--shell2) 0%,var(--shell3) 100%);
  border-radius:var(--r20);padding:var(--s5) var(--s5);
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--sh3);border:1px solid rgba(255,255,255,.07);
  position:relative;overflow:hidden;
}
.today::before{
  content:'';position:absolute;right:-30px;top:-30px;
  width:140px;height:140px;border-radius:50%;
  background:rgba(14,165,255,.06);pointer-events:none;
}
.today-tag{
  font-size:var(--t-2xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:var(--s2);display:flex;align-items:center;gap:var(--s1);
}
.today-tag-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
.today-name{font-size:var(--t-xl);font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1.05}
.today-sub{font-size:var(--t-sm);color:rgba(255,255,255,.4);margin-top:var(--s1)}
.today-date{font-size:var(--t-xs);color:rgba(255,255,255,.22);margin-top:var(--s1)}
.today-btn{
  background:var(--accent);color:#fff;padding:10px var(--s4);
  border-radius:var(--r12);font-size:var(--t-xs);font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;flex-shrink:0;
  box-shadow:0 3px 12px rgba(14,165,255,.4);
  transition:transform 120ms var(--spring),opacity 120ms;border:none;cursor:pointer;
}
.today-btn:active{transform:scale(.94);opacity:.9}

/* ─────────────────────────────────────────
   CALENDAR
───────────────────────────────────────── */
.cal{margin:var(--s3) var(--s4) 0;background:var(--card);border-radius:var(--r20);padding:var(--s4);box-shadow:var(--sh1);border:1px solid var(--border)}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)}
.cal-mo{font-size:var(--t-base);font-weight:700;color:var(--t1);letter-spacing:-.3px}
.cal-ctrl{display:flex;align-items:center;gap:var(--s2)}
.cal-pill{
  padding:5px 11px;border-radius:var(--rpill);
  font-size:var(--t-2xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  transition:all 150ms;border:none;cursor:pointer;
}
.cal-pill.live{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(14,165,255,.3)}
.cal-pill.dim{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(14,165,255,.25)}
.cal-pill:active{transform:scale(.93)}
.cal-arr{
  width:28px;height:28px;border-radius:var(--r8);
  background:var(--bg2);border:1px solid var(--border);
  color:var(--t2);font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:background 120ms;cursor:pointer;
}
.cal-arr:active{background:var(--bg3)}

.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:var(--s2)}
.cal-dow{text-align:center;font-size:var(--t-2xs);font-weight:700;color:var(--t4);letter-spacing:.06em;text-transform:uppercase;padding-bottom:var(--s1)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ct{
  aspect-ratio:1;border-radius:var(--r8);border:1.5px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;gap:2px;
  transition:transform 120ms var(--spring),border-color 120ms;
}
.ct:active{transform:scale(.86)}
.ct.off{pointer-events:none}
.ct-n{font-size:12px;font-weight:700;line-height:1}
.ct-d{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.ct-ck{position:absolute;top:1px;right:2px;font-size:7px;font-weight:900}

/* Legend strip */
.leg{display:flex;gap:var(--s4);flex-wrap:wrap;padding:var(--s3) 0 0;border-top:1px solid var(--border);margin-top:var(--s3)}
.leg-i{display:flex;align-items:center;gap:var(--s1)}
.leg-p{width:7px;height:7px;border-radius:50%}
.leg-t{font-size:var(--t-2xs);font-weight:600;color:var(--t3)}

/* ─────────────────────────────────────────
   DAY HEADER
───────────────────────────────────────── */
.day-hd{
  margin:var(--s3) var(--s4) 0;
  border-radius:var(--r20);padding:var(--s5);
  position:relative;overflow:hidden;
}
.day-hd::after{
  content:'';position:absolute;right:-24px;bottom:-24px;
  width:100px;height:100px;border-radius:50%;
  background:rgba(255,255,255,.05);pointer-events:none;
}
.day-hd-tag{font-size:var(--t-2xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:var(--s2);opacity:.7}
.day-hd-name{font-size:var(--t-xl);font-weight:800;letter-spacing:-.5px;line-height:1.05}
.day-hd-sub{font-size:var(--t-sm);margin-top:var(--s1);opacity:.6}
.day-hd-prog{margin-top:var(--s4)}
.prog-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog-label{font-size:var(--t-2xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.prog-pct{font-size:var(--t-2xs);font-weight:800;font-family:var(--ff-mono);opacity:.8}
.prog-track{height:5px;border-radius:var(--rpill);background:rgba(255,255,255,.12);overflow:hidden}
.prog-fill{height:100%;border-radius:var(--rpill);background:#fff;transition:width 400ms var(--ease-out)}
.day-done{font-size:var(--t-sm);font-weight:700;color:#fff;margin-top:var(--s3)}

/* ─────────────────────────────────────────
   EXERCISE CARDS
───────────────────────────────────────── */
.ex-wrap{padding:var(--s3) var(--s4) 0}
.ex{
  background:var(--card);border-radius:var(--r16);
  border:1.5px solid var(--border);margin-bottom:var(--s2);
  overflow:hidden;box-shadow:var(--sh1);
  transition:border-color 200ms;
}
.ex.done{background:var(--card2);border-color:var(--border)}
.ex-row{display:flex;align-items:center;padding:var(--s3) var(--s4);gap:var(--s3);cursor:pointer;min-height:56px}
.ex-check{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;cursor:pointer;
  transition:all 200ms var(--spring);
}
.ex-check.on{color:#fff;border-color:transparent}
.ex-check.on::after{content:'✓'}
.ex-name{flex:1;font-size:var(--t-sm);font-weight:600;color:var(--t1);line-height:1.35}
.ex-name.out{color:var(--t4);text-decoration:line-through}
.ex-tag{
  font-size:var(--t-2xs);font-weight:800;padding:4px 10px;
  border-radius:var(--rpill);flex-shrink:0;letter-spacing:.03em;
}
.ex-arr{font-size:9px;color:var(--t4);margin-left:var(--s1);transition:transform 200ms var(--ease)}
.ex-arr.up{transform:rotate(180deg)}

.ex-body{border-top:1px solid var(--border);padding:var(--s3) var(--s4)}
.ex-tip{font-size:var(--t-sm);color:var(--t2);line-height:1.7}
.sets-lbl{font-size:var(--t-2xs);font-weight:800;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--s3)}
.sets-row{display:flex;gap:var(--s3);flex-wrap:wrap}
.set-c{display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.set-n{font-size:var(--t-2xs);font-weight:700;color:var(--t4);letter-spacing:.06em;text-transform:uppercase}

/* Rest timer inline */
.rest-row{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--border)}
.rest-btn{
  padding:10px var(--s4);border-radius:var(--rpill);
  font-size:var(--t-xs);font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  border:none;cursor:pointer;flex-shrink:0;
  transition:transform 120ms var(--spring),opacity 120ms;
}
.rest-btn:active{transform:scale(.93);opacity:.85}
.rest-countdown{font-size:var(--t-lg);font-weight:800;letter-spacing:-.5px;font-family:var(--ff-mono)}

/* ─────────────────────────────────────────
   SCROLL PICKER
───────────────────────────────────────── */
.pk-g{display:flex;gap:var(--s2)}
.pk-w{display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.pk-u{font-size:var(--t-2xs);font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}
.pk{
  width:68px;height:148px;overflow:hidden;position:relative;
  border-radius:var(--r12);background:var(--bg2);
  border:1.5px solid var(--border2);cursor:ns-resize;
  user-select:none;-webkit-user-select:none;box-shadow:var(--sh1) inset;
}
.pk::before,.pk::after{
  content:'';position:absolute;left:0;right:0;z-index:2;height:50px;pointer-events:none;
}
.pk::before{top:0;background:linear-gradient(to bottom,var(--picker-fade) 0%,transparent 100%)}
.pk::after{bottom:0;background:linear-gradient(to top,var(--picker-fade) 0%,transparent 100%)}
.pk-lt,.pk-lb{position:absolute;left:6px;right:6px;height:1.5px;background:var(--accent);opacity:.45;z-index:3;pointer-events:none}
.pk-lt{top:calc(50% - 20px)}
.pk-lb{top:calc(50% + 19px)}
.pk-list{display:flex;flex-direction:column;align-items:center;padding:54px 0;will-change:transform}
.pk-item{height:40px;line-height:40px;font-size:14px;font-weight:500;color:var(--t4);text-align:center;width:100%;flex-shrink:0;transition:color .08s,font-size .08s,font-weight .08s}
.pk-item.on{color:var(--accent);font-size:20px;font-weight:800}

/* ─────────────────────────────────────────
   FOOD SECTION
───────────────────────────────────────── */
.food-wrap{padding:var(--s3) var(--s4) 0}
.food-tog{
  width:100%;padding:var(--s3) var(--s4);
  background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--r16);box-shadow:var(--sh1);
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;transition:border-color 150ms;
}
.food-tog:active{border-color:var(--accent)}
.food-tog-l{display:flex;align-items:center;gap:var(--s3)}
.food-icon{font-size:20px;line-height:1}
.food-tog-name{font-size:var(--t-sm);font-weight:700;color:var(--t1)}
.food-tog-r{display:flex;align-items:center;gap:var(--s2)}
.food-cal-badge{
  font-size:var(--t-xs);font-weight:700;padding:3px 9px;
  border-radius:var(--rpill);background:var(--bg2);
  color:var(--t2);border:1px solid var(--border);
  font-family:var(--ff-mono);
}
.food-chev{font-size:9px;color:var(--t4);transition:transform 200ms}
.food-chev.up{transform:rotate(180deg)}

.food-panel{
  background:var(--card);border:1.5px solid var(--border);border-top:none;
  border-radius:0 0 var(--r16) var(--r16);overflow:hidden;
}

/* Macro strip */
.macro-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.macro-cell{padding:var(--s3) var(--s2);text-align:center;border-right:1px solid var(--border)}
.macro-cell:last-child{border-right:none}
.macro-v{font-size:var(--t-md);font-weight:800;line-height:1;font-family:var(--ff-mono)}
.macro-n{font-size:var(--t-2xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-top:2px}
.macro-t{font-size:var(--t-2xs);color:var(--t4);margin-top:1px}
.macro-bar{height:3px;border-radius:var(--rpill);background:var(--bg2);overflow:hidden;margin-top:var(--s1)}
.macro-fill{height:100%;border-radius:var(--rpill);transition:width 400ms var(--ease-out)}

/* Food entries */
.food-list{}
.food-entry{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border)}
.food-entry-n{flex:1;font-size:var(--t-sm);font-weight:600;color:var(--t1)}
.food-entry-m{font-size:var(--t-xs);color:var(--t3);text-align:right;line-height:1.6;font-family:var(--ff-mono)}
.food-del{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:var(--red-dim);color:var(--red);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;cursor:pointer;
  transition:background 120ms;
}
.food-del:active{background:var(--red);color:#fff}
.food-empty{padding:var(--s5);text-align:center;font-size:var(--t-sm);color:var(--t4)}
.food-total-row{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-top:1px solid var(--border)}
.food-total-cell{padding:var(--s2) var(--s2);text-align:center;border-right:1px solid var(--border)}
.food-total-cell:last-child{border-right:none}
.food-total-v{font-size:var(--t-sm);font-weight:800;line-height:1;font-family:var(--ff-mono)}
.food-total-l{font-size:var(--t-2xs);color:var(--t4);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* Add food area */
.food-add{padding:var(--s3) var(--s4)}
.mode-row{display:flex;gap:2px;background:var(--bg2);border-radius:var(--r8);padding:3px;margin-bottom:var(--s3)}
.mode-btn{flex:1;padding:var(--s2);border-radius:var(--r6);font-size:var(--t-xs);font-weight:700;text-align:center;cursor:pointer;color:var(--t3);transition:all 150ms}
.mode-btn.on{background:var(--card);color:var(--accent);box-shadow:var(--sh1)}

.search-bar{position:relative;margin-bottom:var(--s2)}
.search-in{
  width:100%;padding:12px var(--s4) 12px var(--s5);
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:var(--r12);color:var(--t1);
  font-size:var(--t-base);font-weight:500;outline:none;
  transition:border-color 150ms,background 150ms;
}
.search-in:focus{border-color:var(--accent);background:var(--card)}
.search-ico{position:absolute;left:var(--s3);top:50%;transform:translateY(-50%);font-size:14px;opacity:.35;pointer-events:none}
.search-clear{position:absolute;right:var(--s3);top:50%;transform:translateY(-50%);font-size:12px;color:var(--t3);cursor:pointer;padding:var(--s1)}

.food-result{
  padding:var(--s3) var(--s4);background:var(--bg2);border:1.5px solid var(--border);
  border-radius:var(--r12);margin-bottom:var(--s2);cursor:pointer;
  transition:all 120ms var(--ease);
}

  const t=now();S.calY=t.getFullYear();S.calM=t.getMonth();S.foodCalY=t.getFullYear();S.foodCalM=t.getMonth();S.sel=dkey(t);

let _res=[],_sds=null;
function filterFood(ds){
  const q=(document.getElementById('fsearch')?.value||'').trim().toLowerCase();
  _sds=ds;
  if(!q||q.length<2){_res=[];updateFoodRes(ds);return}
  const sc=FDB.map(f=>{const n=f.name.toLowerCase();let s=0;if(n.startsWith(q))s=100;else if(n.includes(q))s=50;else{const ws=q.split(' ');const m=ws.filter(w=>w.length>1&&n.includes(w));s=m.length*20}return{...f,s}}).filter(f=>f.s>0);
  sc.sort((a,b)=>b.s-a.s);_res=sc.slice(0,6);
  updateFoodRes(ds);
}
function updateFoodRes(ds){
  const c=document.getElementById('fres');if(!c)return;
  let h='';
  if(_res.length&&_sds===ds){
    _res.forEach((r,i)=>{h+=`<div class="food-result" onclick="H.medium();pickFood('${ds}',${i})"><div class="food-result-n">${r.name}</div><div class="food-result-m">${r.cal} cal · ${r.protein}g P · ${r.carbs}g C · ${r.fat}g F</div><div class="food-result-cta">＋ Add</div></div>`;});
  }else{
    const q=document.getElementById('fsearch')?.value||'';
    if(q.length>=2)h=`<div class="no-results">No matches — try manual entry</div>`;
  }
  c.innerHTML=h;
}
function pickFood(ds,i){
  const e=_res[i];if(!e)return;
  if(!S.food[ds])S.food[ds]=[];
  S.food[ds].push({name:e.name,cal:e.cal,protein:e.protein,carbs:e.carbs,fat:e.fat});
  _res=[];_sds=null;
  const inp=document.getElementById('fsearch');if(inp)inp.value='';
  H.medium();persist();updateFoodMacros(ds);updateFoodRes(ds);
}
function addManual(ds){
  const n=document.getElementById('mfn')?.value?.trim();
  const c=parseInt(document.getElementById('mfc')?.value)||0;
  const p=parseInt(document.getElementById('mfp')?.value)||0;
  const cb=parseInt(document.getElementById('mfcb')?.value)||0;
  const f=parseInt(document.getElementById('mff')?.value)||0;
  if(!n||!c){H.light();return}
  if(!S.food[ds])S.food[ds]=[];
  S.food[ds].push({name:n,cal:c,protein:p,carbs:cb,fat:f});
  H.medium();persist();render();
}
function delFood(ds,i){if(S.food[ds]){S.food[ds].splice(i,1);H.light();persist();render()}}
function updateFoodMacros(ds){
  const me=document.getElementById('fmacros');const ee=document.getElementById('fentries');
  if(!me||!ee){render();return}
  const ft=foodTot(ds);
  const macros=[{k:'cal',lbl:'Cal',color:'#0EA5FF',t:TARGETS.cal},{k:'protein',lbl:'Pro',color:'#F43F5E',t:TARGETS.protein},{k:'carbs',lbl:'Carb',color:'#FF9500',t:TARGETS.carbs},{k:'fat',lbl:'Fat',color:'#8B5CF6',t:TARGETS.fat}];
  let mh='';
  macros.forEach(m=>{const p=Math.min(100,Math.round((ft[m.k]/m.t)*100)),over=ft[m.k]>m.t;mh+=`<div class="macro-cell"><div class="macro-v" style="color:${over?'var(--red)':m.color}">${ft[m.k]}</div><div class="macro-n">${m.lbl}</div><div class="macro-t">/ ${m.t}</div><div class="macro-bar"><div class="macro-fill" style="width:${p}%;background:${over?'var(--red)':m.color}"></div></div></div>`;});
  me.innerHTML=mh;
  const entries=S.food[ds]||[];
  let eh='';
  if(entries.length){
    entries.forEach((e,i)=>{eh+=`<div class="food-entry"><div class="food-entry-n">${e.name}</div><div class="food-entry-m">${e.cal} cal<br>${e.protein}g P · ${e.carbs}g C · ${e.fat}g F</div><div class="food-del" onclick="delFood('${ds}',${i})">✕</div></div>`;});
    eh+=`<div class="food-total-row"><div class="food-total-cell"><div class="food-total-v" style="color:#0EA5FF">${ft.cal}</div><div class="food-total-l">Cal</div></div><div class="food-total-cell"><div class="food-total-v" style="color:#F43F5E">${ft.protein}g</div><div class="food-total-l">Pro</div></div><div class="food-total-cell"><div class="food-total-v" style="color:#FF9500">${ft.carbs}g</div><div class="food-total-l">Carb</div></div><div class="food-total-cell"><div class="food-total-v" style="color:#8B5CF6">${ft.fat}g</div><div class="food-total-l">Fat</div></div></div>`;
  }else{eh=`<div class="food-empty">Nothing logged yet</div>`;}
  ee.innerHTML=eh;
  const tc=document.getElementById('ftogcal');if(tc)tc.textContent=`${ft.cal} / ${TARGETS.cal} cal`;
}

function rCal(){
  const t=now(),tk=dkey(t),sel=S.sel||tk;
  const sd=pkey(sel),di=pdi(sd),day=di>=0?PLAN[di]:null;
  const wn=wkn(sd),ac=day?day.color:"#0EA5FF",isT=sel===tk;
  const tdi=pdi(t),tday=tdi>=0?PLAN[tdi]:null,twn=wkn(t);
  let h=`<div style="padding-bottom:var(--s2)">`;

  // Today card
  if(tday){
    h+=`<div class="today">
      <div>
        <div class="today-tag"><span class="today-tag-dot"></span>Today · Week ${twn}</div>
        <div class="today-name">Day ${tday.n} — ${tday.label}</div>
        <div class="today-sub">${tday.sub}</div>
        <div class="today-date">${fmt(t)}</div>
      </div>
      ${!isT?`<button class="today-btn" onclick="jumpToday()">Today</button>`:''}
    </div>`;
  }

  // Calendar
  h+=`<div class="cal">
    <div class="cal-hdr">
      <div class="cal-mo">${MOS[S.calM]} ${S.calY}</div>
      <div class="cal-ctrl">
        ${isT?`<div class="cal-pill dim">Today</div>`:`<button class="cal-pill live" onclick="jumpToday()">Today</button>`}
        <button class="cal-arr" onclick="prevM()">‹</button>
        <button class="cal-arr" onclick="nextM()">›</button>
      </div>
    </div>
    <div class="cal-dow-row">`;
  DOW.forEach(d=>{h+=`<div class="cal-dow">${d}</div>`;});
  h+=`</div><div class="cal-grid">`;

  const fd=new Date(S.calY,S.calM,1).getDay();
  const dim=new Date(S.calY,S.calM+1,0).getDate();
  for(let i=0;i<fd;i++)h+=`<div class="ct off"></div>`;
  for(let d=1;d<=dim;d++){
    const cd=new Date(S.calY,S.calM,d),ck=dkey(cd);
    const cdi=pdi(cd),inP=cdi>=0,cDay=inP?PLAN[cdi]:null,cc=cDay?cDay.color:'#9BADC4';
    const isSel=ck===sel,isTc=ck===tk;
    const done=inP&&allDone(ck),pct=inP?dayPct(ck):0;
    const bg=inP?`${cc}16`:'transparent';
    const bc=inP?(isSel?cc:(isTc?`${cc}55`:'transparent')):'transparent';
    h+=`<div class="ct${inP?'':' off'}" style="background:${bg};border-color:${bc}" ${inP?`onclick="selDate('${ck}')"`:''}>`
      +`<div class="ct-n" style="color:${inP?cc:'var(--t4)'};font-weight:${isSel||isTc?800:700}">${d}</div>`;
    if(inP&&!cDay.rest)h+=`<div class="ct-d" style="background:${pct>0?cc:`${cc}40`}"></div>`;
    if(done)h+=`<div class="ct-ck" style="color:${cc}">✓</div>`;
    h+=`</div>`;
  }
  h+=`</div>`;

  // Legend
  h+=`<div class="leg">`;
  const seen={};
  PLAN.forEach(p=>{if(seen[p.color])return;seen[p.color]=1;h+=`<div class="leg-i"><div class="leg-p" style="background:${p.color}"></div><div class="leg-t">${p.abbr}</div></div>`;});
  h+=`</div></div>`;

  // Day header + exercises
  if(day){
    const dp=dayPct(sel);
    h+=`<div class="day-hd" style="background:${ac}16;border:1.5px solid ${ac}2A">
      <div class="day-hd-tag" style="color:${ac}">Week ${wn} · Day ${day.n}${isT?' · Today':''}</div>
      <div class="day-hd-name" style="color:${ac}">${day.label}</div>
      <div class="day-hd-sub" style="color:${ac}">${day.sub} · ${fmt(sd)}</div>`;
    if(!day.rest){
      h+=`<div class="day-hd-prog">
        <div class="prog-meta"><span class="prog-label" style="color:${ac}">Progress</span><span class="prog-pct" style="color:${ac}">${dp}%</span></div>
        <div class="prog-track"><div class="prog-fill" style="width:${dp}%;background:${ac}"></div></div>
      </div>`;
    }
    if(dp===100)h+=`<div class="day-done">All done 🔥</div>`;
    h+=`</div>`;

    // Exercises
    h+=`<div class="ex-wrap">`;
    day.ex.forEach((ex,ei)=>{
      const done=isDone(sel,ei),open=S.expanded===ei;
      const rem=_te?Math.max(0,Math.ceil((_te-Date.now())/1000)):null;
      h+=`<div class="ex${done?' done':''}" style="border-color:${done?`${ac}35`:'var(--border)'}">
        <div class="ex-row" onclick="expand(${ei})">
          <div class="ex-check${done?' on':''}" onclick="event.stopPropagation();tick_('${sel}',${ei})" style="${done?`background:${ac};border-color:transparent`:`border-color:${ac}55;color:${ac}`}"></div>
          <div class="ex-name${done?' out':''}">${ex.name}</div>
          <div class="ex-tag" style="background:${ex.cardio?'var(--bg2)':ac+'18'};color:${ex.cardio?'var(--t3)':ac}">${ex.cardio?ex.reps:`${ex.sets}×${ex.reps}`}</div>
          <div class="ex-arr${open?' up':''}">▼</div>
        </div>`;
      if(open){
        h+=`<div class="ex-body">`;
        if(ex.cardio){
          h+=`<div class="ex-tip">${tip(ex.name)}</div>`;
        }else{
          h+=`<div class="sets-lbl">Scroll to log weight & reps</div><div class="sets-row">`;
          for(let si=0;si<ex.sets;si++){
            const wv=parseInt(S.logs[lk(sel,ei,si,'w')])||0;

          <div class="mf-field"><div class="mf-lbl">Protein (g)</div><input class="mf-in" id="mfp" type="number" inputmode="decimal" placeholder="0"></div>
          <div class="mf-field"><div class="mf-lbl">Carbs (g)</div><input class="mf-in" id="mfcb" type="number" inputmode="decimal" placeholder="0"></div>
          <div class="mf-field"><div class="mf-lbl">Fat (g)</div><input class="mf-in" id="mff" type="number" inputmode="decimal" placeholder="0"></div>
        </div>
        <button class="add-btn" onclick="addManual('${sel}')">+ Add Food</button>`;
      }
      h+=`</div></div>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

/* ─── RENDER: FOOD TAB ────────────────── */
function rFood(){
  const t=now(),tk=dkey(t);
  let h=`<div class="ft">
    <div class="pg-lbl">Daily Targets</div>
    <div class="tgt-row">
      <div class="tgt-c"><div class="tgt-v" style="color:#0EA5FF">${TARGETS.cal}</div><div class="tgt-l">Cal</div></div>
      <div class="tgt-c"><div class="tgt-v" style="color:#F43F5E">${TARGETS.protein}g</div><div class="tgt-l">Protein</div></div>
      <div class="tgt-c"><div class="tgt-v" style="color:#FF9500">${TARGETS.carbs}g</div><div class="tgt-l">Carbs</div></div>
      <div class="tgt-c"><div class="tgt-v" style="color:#8B5CF6">${TARGETS.fat}g</div><div class="tgt-l">Fat</div></div>
    </div>
    <div class="pg-lbl">Monthly Log</div>
    <div class="fcal">
      <div class="cal-hdr" style="margin-bottom:var(--s4)">
        <div class="cal-mo">${MOS[S.foodCalM]} ${S.foodCalY}</div>
        <div class="cal-ctrl"><button class="cal-arr" onclick="prevFM()">‹</button><button class="cal-arr" onclick="nextFM()">›</button></div>
      </div>
      <div class="cal-dow-row">`;
  DOW.forEach(d=>{h+=`<div class="cal-dow">${d}</div>`;});
  h+=`</div><div class="cal-grid">`;
  const fd2=new Date(S.foodCalY,S.foodCalM,1).getDay();
  const dim2=new Date(S.foodCalY,S.foodCalM+1,0).getDate();
  for(let i=0;i<fd2;i++)h+=`<div class="food-tile gone"></div>`;
  for(let d=1;d<=dim2;d++){
    const cd=new Date(S.foodCalY,S.foodCalM,d),ck=dkey(cd);
    const fut=cd>t,isT2=ck===tk;
    const logged=(S.food[ck]||[]).length>0,met=goalMet(ck);
    let bg='transparent',bc='transparent',icon='',nc='var(--t4)';
    if(!fut&&logged){bg=met?'var(--green-dim)':'var(--red-dim)';bc=met?'var(--green)':'var(--red)';icon=met?'✅':'⚠️';nc=met?'var(--green)':'var(--red)';}
    if(isT2){bc='var(--accent)';nc='var(--accent)';}
    h+=`<div class="food-tile${fut?' gone':''}" style="background:${bg};border-color:${bc}" ${!fut?`onclick="selDate('${ck}');S.tab='cal';S.foodOpen=true;render()"`:''}>
      <div class="ft-n" style="color:${nc}">${d}</div>
      ${logged?`<div class="ft-i">${icon}</div>`:''}
    </div>`;
  }
  h+=`</div>
    <div class="leg" style="padding-top:var(--s3);border-top:1px solid var(--border);margin-top:var(--s3)">
      <div class="leg-i"><div class="leg-p" style="background:var(--green)"></div><div class="leg-t">Goal met</div></div>
      <div class="leg-i"><div class="leg-p" style="background:var(--red)"></div><div class="leg-t">Off target</div></div>
    </div>
  </div>`;

  // Weekly averages
  const wn2=wkn(t),dw=wn2>0?wn2:1;
  let wc=0,wp=0,wcb=0,wf=0,wd=0;
  for(let d=0;d<7;d++){
    const date=new Date(START);date.setDate(date.getDate()+(dw-1)*7+d);
    if(date>t)continue;
    const tot=foodTot(dkey(date));
    if(tot.cal>0){wc+=tot.cal;wp+=tot.protein;wcb+=tot.carbs;wf+=tot.fat;wd++;}
  }
  if(wd>0){
    h+=`<div class="pg-lbl" style="margin-top:var(--s5)">Week ${dw} — Daily Averages</div>
    <div class="avg-row">
      <div class="avg-c"><div class="avg-v" style="color:#0EA5FF">${Math.round(wc/wd)}</div><div class="avg-l">Cal</div></div>
      <div class="avg-c"><div class="avg-v" style="color:#F43F5E">${Math.round(wp/wd)}g</div><div class="avg-l">Pro</div></div>
      <div class="avg-c"><div class="avg-v" style="color:#FF9500">${Math.round(wcb/wd)}g</div><div class="avg-l">Carb</div></div>
      <div class="avg-c"><div class="avg-v" style="color:#8B5CF6">${Math.round(wf/wd)}g</div><div class="avg-l">Fat</div></div>
    </div>`;
  }
  h+=`</div>`;
  return h;
}

/* ─── RENDER: PROGRESS ────────────────── */
function wkPct(wk){let t=0,c=0;for(let d=0;d<7;d++){const date=new Date(START);date.setDate(date.getDate()+(wk-1)*7+d);const ds=dkey(date);PLAN[d].ex.forEach((_,ei)=>{t++;if(isDone(ds,ei))c++;});}return Math.round((c/t)*100)}
function rProg(){
  const t=now(),wn=wkn(t),dw=wn>0?wn:1;
  let h=`<div class="pg">
    <div class="pg-lbl">All 33 Weeks</div>
    <div class="wk-grid">`;
  for(let w=1;w<=WEEKS;w++){
    const p=wkPct(w),col=p===100?'var(--green)':p>0?'var(--orange)':'var(--t4)';
    h+=`<div class="wk-t" onclick="jumpWeek(${w})"><div class="wk-t-lbl">Wk ${w}</div><div class="wk-t-pct" style="color:${col}">${p}%</div></div>`;
  }
  h+=`</div><div class="pg-lbl">Week ${dw} — Breakdown</div>`;
  for(let d=0;d<7;d++){
    const date=new Date(START);date.setDate(date.getDate()+(dw-1)*7+d);
    const ds=dkey(date),pd2=PLAN[d];
    const comp=pd2.ex.filter((_,ei)=>isDone(ds,ei)).length;
    const p=Math.round((comp/pd2.ex.length)*100),pc=p===100?'var(--green)':'var(--t3)';
    h+=`<div class="wk-day" onclick="selDate('${ds}');switchTab('cal')">
      <div class="wk-day-top">
        <div><div class="wk-day-name" style="color:${pd2.color}">Day ${pd2.n} — ${pd2.label}</div><div class="wk-day-meta">${fmt(date)}</div></div>
        <div class="wk-day-pct" style="color:${pc}">${p}%</div>
      </div>
      <div class="wk-p-track"><div class="wk-p-fill" style="width:${p}%;background:${pd2.color}"></div></div>
      <div class="chip-row">`;
    pd2.ex.forEach((_ex,ei)=>{const done2=isDone(ds,ei);const lbl=_ex.name.length>16?_ex.name.slice(0,14)+'…':_ex.name;h+=`<span class="chip" style="background:${done2?pd2.color+'20':'var(--bg2)'};color:${done2?pd2.color:'var(--t4)'}">${lbl}</span>`;});
    h+=`</div></div>`;
  }
  h+=`</div>`;
  return h;
}

/* ─── RENDER: STRENGTH ────────────────── */
function bwt(wk,di,ei){const date=new Date(START);date.setDate(date.getDate()+(wk-1)*7+di);const ds=dkey(date),ex=PLAN[di].ex[ei];if(ex.cardio)return null;let best=0;for(let si=0;si<ex.sets;si++){const v=parseFloat(S.logs[lk(ds,ei,si,'w')]);if(!isNaN(v)&&v>best)best=v;}return best>0?best:null}
function rStr(){
  const lifts=PLAN.filter(p=>!p.rest),cw=wkn(now());
  let h=`<div class="str">`;
  h+=`<div class="pg-lbl" style="margin-bottom:var(--s4)">Weight Progression</div>`;
  lifts.forEach(day=>{
    const di=PLAN.indexOf(day),exs=day.ex.filter(e=>!e.cardio);
    h+=`<div style="margin-bottom:var(--s5)">
      <div class="str-day-hd" style="background:${day.color}14;border:1.5px solid ${day.color}25">
        <div class="str-day-n" style="color:${day.color}">Day ${day.n} — ${day.label}</div>
        <div class="str-day-s" style="color:${day.color}">${day.sub}</div>
      </div>`;
    exs.forEach(ex=>{
      const ei=day.ex.indexOf(ex),wts=[];
      for(let w=1;w<=WEEKS;w++)wts.push(bwt(w,di,ei));
      const lg=wts.filter(w=>w!==null),mx=lg.length?Math.max(...lg):0;
      const fw=lg.length?lg[0]:null,lw=lg.length?lg[lg.length-1]:null;
      const gain=fw&&lw&&lw!==fw?lw-fw:null;
      h+=`<div class="str-ex"><div class="str-ex-n">${ex.name}</div>`;
      if(!lg.length){h+=`<div class="str-empty">No data yet — log a set to see progress.</div>`;}
      else{
        h+=`<div class="str-chart">`;
        wts.forEach((w,wi)=>{const ht=mx>0&&w?(w/mx)*100:0,cur=(wi+1)===cw;if(w)h+=`<div class="str-bw"><div class="str-b" style="height:${ht}%;background:${day.color};opacity:${cur?1:.25}"></div></div>`;else h+=`<div class="str-bw"><div class="str-be"></div></div>`;});
        h+=`</div><div class="str-wl">`;
        for(let wi=0;wi<WEEKS;wi++){const cur=(wi+1)===cw;h+=`<div class="str-wn" style="color:${cur?day.color:'var(--t4)'}">${wi%4===0?`W${wi+1}`:''}</div>`;}
        h+=`</div><div class="str-stats">
          <div class="str-stat"><div class="str-sv" style="color:${day.color}">${fw??'—'}</div><div class="str-sl">Start</div></div>
          <div class="str-stat"><div class="str-sv" style="color:${day.color}">${mx||'—'}</div><div class="str-sl">Best</div></div>
          <div class="str-stat"><div class="str-sv" style="color:${day.color}">${lw??'—'}</div><div class="str-sl">Latest</div></div>
        </div>`;
        if(gain!==null)h+=`<div class="str-gain" style="color:${gain>0?'var(--green)':'var(--red)'}">${gain>0?'▲':'▼'} ${Math.abs(gain)} lbs ${gain>0?'gained':'lost'} since Week 1</div>`;
      }
      h+=`</div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;
  return h;
}

/* ─── MAIN RENDER ─────────────────────── */
function render(){
  const sel=S.sel||dkey(now()),sd=pkey(sel);
  const di=pdi(sd),day=di>=0?PLAN[di]:null,ac=day?day.color:'#0EA5FF';
  let h=`<div class="hdr"><div class="hdr-inner">
    <div class="hdr-row">
      <div>
        <div class="hdr-title">Tracker</div>
        <div class="hdr-meta">May 18 – Dec 31 · 2026</div>
      </div>
      <button class="hdr-btn" onclick="toggleDark()">${S.dark?'☀️':'🌙'}</button>
    </div>
    <div class="seg">
      <div class="seg-tab${S.tab==='cal'?' on':''}" onclick="switchTab('cal')">Calendar</div>
      <div class="seg-tab${S.tab==='prog'?' on':''}" onclick="switchTab('prog')">Progress</div>
      <div class="seg-tab${S.tab==='str'?' on':''}" onclick="switchTab('str')">Strength</div>
      <div class="seg-tab${S.tab==='food'?' on':''}" onclick="switchTab('food')">Food</div>
    </div>
  </div></div>`;
  if(S.tab==='cal')h+=rCal();
  else if(S.tab==='prog')h+=rProg();
  else if(S.tab==='str')h+=rStr();
  else h+=rFood();
  document.getElementById('app').innerHTML=h;
  requestAnimationFrame(()=>{
    initPickers();
    if(S.tab==='cal'&&S.expanded!==null){
      const w=document.querySelector('.ex-wrap');
      if(w)w.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  });
}

/* ─── PICKERS ─────────────────────────── */
const LBS=[],REPS=[],IH=40;
for(let v=0;v<=300;v+=5)LBS.push(v);
for(let v=0;v<=50;v++)REPS.push(v);
function buildPk(el,vals,cur){const l=el.querySelector('.pk-list');l.innerHTML='';vals.forEach(v=>{const i=document.createElement('div');i.className='pk-item'+(v===cur?' on':'');i.textContent=v;l.appendChild(i)});l.style.transform=`translateY(${-vals.indexOf(cur)*IH}px)`}
function getOff(el){return new DOMMatrix(el.querySelector('.pk-list').style.transform).m42}
function snapPk(el,vals,ds,ei,si,f){const l=el.querySelector('.pk-list');let idx=Math.max(0,Math.min(Math.round(-getOff(el)/IH),vals.length-1));l.style.transition='transform 200ms cubic-bezier(.25,.46,.45,.94)';l.style.transform=`translateY(${-idx*IH}px)`;l.querySelectorAll('.pk-item').forEach((x,i)=>x.classList.toggle('on',i===idx));S.logs[lk(ds,ei,si,f)]=String(vals[idx]);H.tick();persist()}
function initPickers(){
  document.querySelectorAll('.pk').forEach(el=>{
    if(el.dataset.ready)return;el.dataset.ready='1';
    const f=el.dataset.f,ds=el.dataset.ds,ei=parseInt(el.dataset.ei),si=parseInt(el.dataset.si);
    const vals=f==='w'?LBS:REPS;
    const stored=parseInt(S.logs[lk(ds,ei,si,f)])||0;
    const cur=vals.includes(stored)?stored:vals[0];
    buildPk(el,vals,cur);
    const l=el.querySelector('.pk-list');
    let sy=0,ly=0,so=0,drag=false,vel=0,lt=0;
    el.addEventListener('touchstart',e=>{e.preventDefault();l.style.transition='none';sy=e.touches[0].clientY;ly=sy;so=getOff(el);drag=true;vel=0;lt=Date.now()},{passive:false});
    el.addEventListener('touchmove',e=>{if(!drag)return;e.preventDefault();const y=e.touches[0].clientY,n=Date.now();vel=(y-ly)/(n-lt+1);ly=y;lt=n;const no=Math.max(-(vals.length-1)*IH,Math.min(0,so+(y-sy)));l.style.transform=`translateY(${no}px)`;const idx=Math.round(-no/IH);l.querySelectorAll('.pk-item').forEach((x,i)=>x.classList.toggle('on',i===idx))},{passive:false});
    el.addEventListener('touchend',()=>{if(!drag)return;drag=false;const proj=getOff(el)+vel*80,cl=Math.max(-(vals.length-1)*IH,Math.min(0,proj));l.style.transition='transform 200ms ease';l.style.transform=`translateY(${cl}px)`;setTimeout(()=>snapPk(el,vals,ds,ei,si,f),205)});
    el.addEventListener('wheel',e=>{e.preventDefault();l.style.transition='none';const no=Math.max(-(vals.length-1)*IH,Math.min(0,getOff(el)-Math.sign(e.deltaY)*IH));l.style.transform=`translateY(${no}px)`;setTimeout(()=>snapPk(el,vals,ds,ei,si,f),55)},{passive:false});
  });
}

/* ─── ACTIONS ─────────────────────────── */
function switchTab(t){S.tab=t;S.expanded=null;S.foodOpen=false;H.light();render()}
function toggleDark(){S.dark=!S.dark;document.body.classList.toggle('dark',S.dark);persist();render()}
function prevM(){S.calM===0?(S.calM=11,S.calY--):S.calM--;render()}
function nextM(){S.calM===11?(S.calM=0,S.calY++):S.calM++;render()}
function prevFM(){S.foodCalM===0?(S.foodCalM=11,S.foodCalY--):S.foodCalM--;render()}
function nextFM(){S.foodCalM===11?(S.foodCalM=0,S.foodCalY++):S.foodCalM++;render()}
function selDate(ds){S.sel=ds;S.expanded=null;render()}
function jumpToday(){const t=now();S.calY=t.getFullYear();S.calM=t.getMonth();S.sel=dkey(t);S.expanded=null;render()}
function jumpWeek(w){const d=new Date(START);d.setDate(d.getDate()+(w-1)*7);S.calY=d.getFullYear();S.calM=d.getMonth();S.sel=dkey(d);S.tab='cal';S.expanded=null;render()}
function expand(ei){S.expanded=S.expanded===ei?null:ei;H.light();render()}
function tick_(ds,ei){const k=dk2(ds,ei);S.done[k]=!S.done[k];H.medium();persist();render()}

/* ─── INIT ────────────────────────────── */
boot();render();
</script>
</body>
</html>
