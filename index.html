<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1923">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F1923'/><text y='.9em' font-size='72' x='50%' text-anchor='middle' font-family='system-ui' font-weight='900' fill='%231493FF'>T</text></svg>">
<title>Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   RESET
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font-family:inherit;border:none;background:none;cursor:pointer}
input,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ═══════════════════════════════════════════
   DESIGN TOKENS — 8px grid
═══════════════════════════════════════════ */
:root{
  /* Spacing scale — multiples of 8 */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;

  /* Type scale */
  --text-xs:10px;--text-sm:12px;--text-base:14px;--text-md:16px;--text-lg:20px;--text-xl:24px;--text-2xl:32px;

  /* Radii */
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-full:9999px;

  /* Shadows */
  --shadow-xs:0 1px 2px rgba(0,0,0,.06);
  --shadow-sm:0 2px 6px rgba(0,0,0,.08);
  --shadow-md:0 4px 16px rgba(0,0,0,.10);
  --shadow-lg:0 8px 32px rgba(0,0,0,.14);

  /* Transitions */
  --ease:cubic-bezier(.4,0,.2,1);
  --dur-fast:120ms;--dur-base:200ms;--dur-slow:300ms;

  /* Brand */
  --blue:#1493FF;
  --blue-dim:rgba(20,147,255,.12);
  --blue-border:rgba(20,147,255,.3);

  /* Workout type colors — data only */
  --c-push:#1493FF;
  --c-pull:#7B4FFF;
  --c-legs:#2CB459;
  --c-upper:#E8445A;
  --c-abs:#00B3A6;
  --c-rest:#F5A623;

  /* Semantic */
  --green:#2CB459;--green-dim:rgba(44,180,89,.12);
  --red:#E8445A;--red-dim:rgba(232,68,90,.12);
  --orange:#F5A623;--orange-dim:rgba(245,166,35,.12);
}

/* Light theme */
body{
  --bg:#F4F7FB;
  --bg-2:#EDF0F6;
  --surface:#FFFFFF;
  --surface-raised:#FFFFFF;
  --border:rgba(29,54,94,.10);
  --border-strong:rgba(29,54,94,.18);
  --ink-1:#0F1923;
  --ink-2:#3D5068;
  --ink-3:#7A94AD;
  --ink-4:#B0C4D4;
  --nav-bg:#0F1923;
  --nav-border:rgba(255,255,255,.06);
  --picker-fade:var(--surface);
  background:var(--bg);
  color:var(--ink-1);
  font-family:'Inter',system-ui,sans-serif;
}

/* Dark theme */
body.dark{
  --bg:#0A0F16;
  --bg-2:#111820;
  --surface:#151E28;
  --surface-raised:#1C2736;
  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.14);
  --ink-1:#EEF2F7;
  --ink-2:#8AA4BC;
  --ink-3:#4D6880;
  --ink-4:#2A3D50;
  --nav-bg:#070C12;
  --picker-fade:var(--surface);
  background:var(--bg);
  color:var(--ink-1);
}

/* ═══════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════ */
#app{min-height:100vh;padding-bottom:88px}

/* ═══════════════════════════════════════════
   NAVIGATION HEADER
═══════════════════════════════════════════ */
.nav{
  background:var(--nav-bg);
  padding:52px var(--sp-4) var(--sp-4);
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid var(--nav-border);
}
.nav-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--sp-1)}
.nav-title{
  font-size:var(--text-xl);font-weight:800;letter-spacing:-.4px;
  color:#fff;line-height:1.1;
}
.nav-sub{font-size:var(--text-xs);color:rgba(255,255,255,.3);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.nav-actions{display:flex;gap:var(--sp-2);align-items:center;padding-top:2px}
.nav-icon-btn{
  width:32px;height:32px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:background var(--dur-fast) var(--ease);
}
.nav-icon-btn:active{background:rgba(255,255,255,.16)}

/* Tab bar */
.tabs{display:flex;gap:var(--sp-1);margin-top:var(--sp-3);background:rgba(255,255,255,.05);border-radius:var(--r-full);padding:3px}
.tab{
  flex:1;padding:7px var(--sp-2);border-radius:var(--r-full);
  font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:rgba(255,255,255,.35);text-align:center;
  transition:all var(--dur-base) var(--ease);
}
.tab.on{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(20,147,255,.4)}

/* ═══════════════════════════════════════════
   SECTION CHROME
═══════════════════════════════════════════ */
.section{padding:var(--sp-4) var(--sp-4) 0}
.section-title{
  font-size:var(--text-xs);font-weight:700;color:var(--ink-3);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:var(--sp-3);
}

/* ═══════════════════════════════════════════
   CARD SYSTEM
═══════════════════════════════════════════ */
.card{
  background:var(--surface);border-radius:var(--r-lg);
  border:1px solid var(--border);box-shadow:var(--shadow-sm);
}
.card-hero{
  background:var(--nav-bg);border-radius:var(--r-xl);
  box-shadow:var(--shadow-md);overflow:hidden;
}
.card-inset{
  background:var(--bg-2);border-radius:var(--r-md);
  border:1px solid var(--border);
}

/* ═══════════════════════════════════════════
   TODAY BANNER
═══════════════════════════════════════════ */
.today-banner{
  margin:var(--sp-4) var(--sp-4) 0;
  padding:var(--sp-4) var(--sp-4);
  background:var(--nav-bg);
  border-radius:var(--r-xl);
  box-shadow:var(--shadow-md);
  display:flex;align-items:center;justify-content:space-between;
  position:relative;overflow:hidden;
}
.today-banner::after{
  content:'';position:absolute;top:-40px;right:-20px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(20,147,255,.08);pointer-events:none;
}
.today-eyebrow{font-size:var(--text-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.today-name{font-size:var(--text-xl);font-weight:800;color:#fff;line-height:1.1;letter-spacing:-.3px}
.today-sub{font-size:var(--text-sm);color:rgba(255,255,255,.45);margin-top:3px}
.today-date{font-size:var(--text-xs);color:rgba(255,255,255,.25);margin-top:2px}
.today-jump{
  background:var(--blue);color:#fff;
  padding:8px var(--sp-3);border-radius:var(--r-full);
  font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;flex-shrink:0;
  box-shadow:0 2px 8px rgba(20,147,255,.35);
  transition:opacity var(--dur-fast) var(--ease);
}
.today-jump:active{opacity:.8}

/* ═══════════════════════════════════════════
   CALENDAR
═══════════════════════════════════════════ */
.cal-wrap{margin:var(--sp-3) var(--sp-4) 0}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)}
.cal-month{font-size:var(--text-md);font-weight:700;color:var(--ink-1);letter-spacing:-.2px}
.cal-header-right{display:flex;align-items:center;gap:var(--sp-2)}
.cal-nav-btn{
  width:30px;height:30px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);
  color:var(--ink-2);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-xs);transition:all var(--dur-fast) var(--ease);
}
.cal-nav-btn:active{background:var(--bg-2)}
.cal-today-pill{
  padding:5px 10px;border-radius:var(--r-full);
  font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--blue);color:#fff;
  box-shadow:0 2px 6px rgba(20,147,255,.3);
  transition:opacity var(--dur-fast);
}
.cal-today-pill:active{opacity:.8}
.cal-today-pill.inactive{background:var(--blue-dim);color:var(--blue);box-shadow:none;border:1px solid var(--blue-border)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:9px;font-weight:700;color:var(--ink-4);letter-spacing:.08em;text-transform:uppercase;padding-bottom:var(--sp-2)}

.cal-tile{
  aspect-ratio:1;border-radius:var(--r-sm);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;cursor:pointer;gap:2px;
  border:1.5px solid transparent;
  transition:transform var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease);
}
.cal-tile:active{transform:scale(.92)}
.cal-tile.empty,.cal-tile.gone{pointer-events:none}
.cal-num{font-size:12px;font-weight:700;line-height:1;color:var(--ink-3)}
.cal-dot{width:4px;height:4px;border-radius:50%}
.cal-check{position:absolute;top:1px;right:2px;font-size:7px;font-weight:900}

/* Legend */
.cal-legend{display:flex;flex-wrap:wrap;gap:var(--sp-3);padding:var(--sp-3) 0 var(--sp-1)}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-pip{width:6px;height:6px;border-radius:50%}
.legend-txt{font-size:9px;font-weight:600;color:var(--ink-3)}

/* ═══════════════════════════════════════════
   DAY HEADER
═══════════════════════════════════════════ */
.day-hd{
  margin:var(--sp-3) var(--sp-4) 0;
  padding:var(--sp-4);border-radius:var(--r-xl);
  position:relative;overflow:hidden;
}
.day-hd::before{
  content:'';position:absolute;top:-20px;right:-20px;
  width:100px;height:100px;border-radius:50%;
  background:rgba(255,255,255,.06);pointer-events:none;
}
.day-hd-eyebrow{font-size:var(--text-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;opacity:.7}
.day-hd-name{font-size:var(--text-xl);font-weight:800;letter-spacing:-.3px;line-height:1.1}
.day-hd-sub{font-size:var(--text-sm);margin-top:3px;opacity:.6}
.day-hd-prog-row{display:flex;justify-content:space-between;align-items:center;margin-top:var(--sp-3);margin-bottom:5px}
.day-hd-prog-label{font-size:var(--text-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
.day-hd-prog-pct{font-size:var(--text-xs);font-weight:700;opacity:.8}
.prog-track{height:4px;border-radius:var(--r-full);background:rgba(255,255,255,.12);overflow:hidden}
.prog-bar{height:100%;border-radius:var(--r-full);background:#fff;transition:width var(--dur-slow) var(--ease)}
.day-done{margin-top:var(--sp-2);font-size:var(--text-sm);font-weight:700;color:#fff}

/* ═══════════════════════════════════════════
   EXERCISE CARDS
═══════════════════════════════════════════ */
.ex-list{padding:var(--sp-2) var(--sp-4) 0}
.ex-card{
  background:var(--surface);border-radius:var(--r-lg);
  border:1.5px solid var(--border);margin-bottom:var(--sp-2);
  overflow:hidden;box-shadow:var(--shadow-xs);
  transition:border-color var(--dur-base) var(--ease);
}
.ex-card.done{background:var(--bg-2)}
.ex-row{display:flex;align-items:center;padding:var(--sp-3) var(--sp-3);gap:var(--sp-2);cursor:pointer}
.ex-check{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;
  transition:all var(--dur-base) var(--ease);
  cursor:pointer;
}
.ex-check.ticked{border-color:transparent;color:#fff}
.ex-check.ticked::after{content:'✓'}
.ex-name{flex:1;font-size:var(--text-base);font-weight:600;color:var(--ink-1);transition:color var(--dur-base)}
.ex-name.faded{color:var(--ink-4);text-decoration:line-through}
.ex-pill{
  font-size:10px;font-weight:700;padding:3px var(--sp-2);
  border-radius:var(--r-full);flex-shrink:0;
}
.ex-chev{font-size:9px;color:var(--ink-4);margin-left:2px;transition:transform var(--dur-base) var(--ease)}
.ex-chev.open{transform:rotate(180deg)}

.ex-detail{border-top:1px solid var(--border);padding:var(--sp-3)}
.ex-tip{font-size:var(--text-sm);color:var(--ink-2);line-height:1.65}

/* Sets */
.sets-hd{font-size:var(--text-xs);font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--sp-3)}
.sets-row{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.set-col{display:flex;flex-direction:column;align-items:center;gap:var(--sp-1)}
.set-lbl{font-size:9px;font-weight:700;color:var(--ink-4);letter-spacing:.06em;text-transform:uppercase}

/* ═══════════════════════════════════════════
   SCROLL PICKER — iOS style
═══════════════════════════════════════════ */
.picker-group{display:flex;gap:var(--sp-1);align-items:flex-end}
.picker-wrap{display:flex;flex-direction:column;align-items:center;gap:var(--sp-1)}
.picker-unit{font-size:9px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.picker{
  width:66px;height:148px;overflow:hidden;position:relative;
  border-radius:var(--r-md);background:var(--bg-2);
  border:1.5px solid var(--border);cursor:ns-resize;
  user-select:none;-webkit-user-select:none;
  box-shadow:var(--shadow-xs) inset;
}
.picker::before,.picker::after{
  content:'';position:absolute;left:0;right:0;z-index:2;height:50px;pointer-events:none;
}
.picker::before{top:0;background:linear-gradient(to bottom,var(--picker-fade) 0%,transparent 100%)}
.picker::after{bottom:0;background:linear-gradient(to top,var(--picker-fade) 0%,transparent 100%)}
.picker-sel-top,.picker-sel-bot{
  position:absolute;left:6px;right:6px;height:1px;
  background:var(--blue);opacity:.5;z-index:3;pointer-events:none;
}
.picker-sel-top{top:calc(50% - 20px)}
.picker-sel-bot{top:calc(50% + 19px)}
.picker-list{
  display:flex;flex-direction:column;align-items:center;
  padding:54px 0;will-change:transform;
}
.picker-item{
  height:40px;line-height:40px;
  font-size:14px;font-weight:500;
  color:var(--ink-4);text-align:center;width:100%;flex-shrink:0;
  transition:color .08s,font-size .08s,font-weight .08s;
}
.picker-item.on{color:var(--blue);font-size:20px;font-weight:800}

/* ═══════════════════════════════════════════
   REST TIMER — sticky bar
═══════════════════════════════════════════ */
.timer-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--nav-bg);border-top:1px solid rgba(255,255,255,.08);
  padding:var(--sp-2) var(--sp-4) calc(var(--sp-2) + env(safe-area-inset-bottom));
  display:none;align-items:center;gap:var(--sp-3);
  box-shadow:0 -4px 20px rgba(0,0,0,.3);
}
.timer-bar.on{display:flex}
.timer-ring{position:relative;width:44px;height:44px;flex-shrink:0}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#fff;
}
.timer-info{flex:1}
.timer-label{font-size:var(--text-xs);color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase;margin-bottom:1px}
.timer-time{font-size:var(--text-xl);font-weight:800;color:#fff;line-height:1;letter-spacing:-.5px}
.timer-cancel{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  transition:background var(--dur-fast);
}
.timer-cancel:active{background:rgba(255,255,255,.15)}

/* ═══════════════════════════════════════════
   FOOD SECTION
═══════════════════════════════════════════ */
.food-wrap{padding:var(--sp-3) var(--sp-4) 0}
.food-toggle{
  width:100%;padding:var(--sp-3) var(--sp-4);
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r-lg);
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-xs);transition:border-color var(--dur-fast);
}
.food-toggle:active{border-color:var(--blue)}
.food-toggle-left{display:flex;align-items:center;gap:var(--sp-2)}
.food-toggle-icon{font-size:18px}
.food-toggle-label{font-size:var(--text-base);font-weight:600;color:var(--ink-1)}
.food-toggle-right{display:flex;align-items:center;gap:var(--sp-2)}
.food-toggle-cal{
  font-size:var(--text-xs);font-weight:700;
  color:var(--ink-3);background:var(--bg-2);
  padding:3px var(--sp-2);border-radius:var(--r-full);
  border:1px solid var(--border);
}
.food-toggle-chev{font-size:9px;color:var(--ink-4);transition:transform var(--dur-base)}
.food-toggle-chev.open{transform:rotate(180deg)}

.food-panel{
  background:var(--surface);border:1.5px solid var(--border);
  border-top:none;border-radius:0 0 var(--r-lg) var(--r-lg);
  overflow:hidden;
}

/* Macro summary */
.macro-bar{display:flex;border-bottom:1px solid var(--border)}
.macro-cell{flex:1;padding:var(--sp-2) var(--sp-1);text-align:center;border-right:1px solid var(--border)}
.macro-cell:last-child{border-right:none}
.macro-num{font-size:var(--text-md);font-weight:800;line-height:1}
.macro-name{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;color:var(--ink-3)}
.macro-target{font-size:9px;color:var(--ink-4);margin-top:1px}
.macro-prog{height:3px;border-radius:var(--r-full);background:var(--border);overflow:hidden;margin-top:4px}
.macro-prog-fill{height:100%;border-radius:var(--r-full);transition:width var(--dur-slow)}

/* Entry list */
.food-entries{max-height:200px;overflow-y:auto}
.food-entry{display:flex;align-items:center;gap:var(--sp-2);padding:10px var(--sp-3);border-bottom:1px solid var(--border)}
.food-entry-name{flex:1;font-size:var(--text-sm);font-weight:600;color:var(--ink-1)}
.food-entry-info{font-size:10px;color:var(--ink-3);text-align:right;line-height:1.5}
.food-del{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:var(--red-dim);color:var(--red);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;cursor:pointer;
  transition:background var(--dur-fast);
}
.food-del:active{background:var(--red)}

.food-empty{padding:var(--sp-4);text-align:center;font-size:var(--text-sm);color:var(--ink-4);border-bottom:1px solid var(--border)}

/* Add food area */
.food-add{padding:var(--sp-3)}
.food-mode-row{display:flex;gap:3px;background:var(--bg-2);border-radius:var(--r-md);padding:3px;margin-bottom:var(--sp-3)}
.food-mode-btn{
  flex:1;padding:var(--sp-2);border-radius:var(--r-sm);
  font-size:var(--text-xs);font-weight:700;letter-spacing:.04em;
  color:var(--ink-3);text-align:center;cursor:pointer;
  transition:all var(--dur-base) var(--ease);
}
.food-mode-btn.on{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm)}

/* Search mode */
.food-search-row{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.food-search-in{
  flex:1;padding:11px var(--sp-3);
  background:var(--bg-2);border:1.5px solid var(--border);
  border-radius:var(--r-md);color:var(--ink-1);

   exercises:[{name:"Flat Dumbbell Press",sets:3,reps:"8–12",rest:180},{name:"Cable Straight-Arm Pulldown",sets:3,reps:"12–15",rest:90},{name:"Lat Pulldown (Close Grip)",sets:3,reps:"10–12",rest:90},{name:"Single-Arm DB Row",sets:3,reps:"10–12",rest:90},{name:"EZ Bar Curl",sets:3,reps:"10–12",rest:90},{name:"Skull Crushers",sets:3,reps:"10–12",rest:90},{name:"LISS Cardio",sets:1,reps:"10–15 min",cardio:true}]},
  {n:7,label:"ABS+SH",abbr:"ABS",  sub:"Core · Shoulders · Fat Burn",color:"#00B3A6",
   exercises:[{name:"Machine Shoulder Press",sets:3,reps:"10–12",rest:90},{name:"Cable Lateral Raise",sets:3,reps:"15–20",rest:60},{name:"Hanging Leg Raise",sets:3,reps:"15",rest:60},{name:"Cable Crunch",sets:3,reps:"20",rest:60},{name:"Decline Sit-Up",sets:3,reps:"12–15",rest:60},{name:"Plank",sets:3,reps:"45 sec",rest:60},{name:"Fat Burn Finisher Circuit",sets:1,reps:"15 min",cardio:true}]},

const TARGETS = {cal:2000,protein:140,carbs:180,fat:65};

/* ═══════════════════════════════════════════

═══════════════════════════════════════════ */
const dk  = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd  = k => { const[y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const now = () => { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); };
const fmt = d => `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
const pdi = d => { const diff=Math.round((d-START)/86400000); return diff<0||diff>=DAYS?-1:diff%7; };
const wkn = d => { const diff=Math.round((d-START)/86400000); return diff<0||diff>=DAYS?-1:Math.floor(diff/7)+1; };

═══════════════════════════════════════════ */

let S = {
  tab:"cal",calY:null,calM:null,sel:null,

  dark:false,
  logs:{},done:{},food:{}
};

function boot() {
  try {
    // Try new key first, then migrate from old keys
    const r = localStorage.getItem(SK);
    if(r) {
      const p=JSON.parse(r);
      S.logs=p.logs||{}; S.done=p.done||{}; S.food=p.food||{}; S.dark=p.dark||false;
    } else {
      for(const k of ["wt_cal_v2","wt_cal_v1","wt_data_v2","wt_data_v1"]){
        const o=localStorage.getItem(k);
        if(o){ try{ const p=JSON.parse(o); S.logs=p.logs||{}; S.done=p.done||{}; }catch(e){} break; }
      }
    }
  } catch(e){}
  const t=now();
  S.calY=t.getFullYear(); S.calM=t.getMonth();
  S.foodCalY=t.getFullYear(); S.foodCalM=t.getMonth();
  S.sel=dk(t);
  if(S.dark) document.body.classList.add('dark');
}

let _tt=null;
function persist() {
  try{ localStorage.setItem(SK,JSON.stringify({logs:S.logs,done:S.done,food:S.food,dark:S.dark})); }catch(e){}
  const el=document.getElementById('toast');
  el.classList.add('on'); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('on'),1400);
}

const lkey = (ds,ei,si,f) => `${ds}|${ei}|${si}|${f}`;
const dkey  = (ds,ei)     => `${ds}|${ei}`;

function isDone(ds,ei)   { return !!S.done[dkey(ds,ei)]; }
function allDone(ds)     { const d=pdi(pd(ds)); if(d<0) return false; return PLAN[d].exercises.every((_,i)=>isDone(ds,i)); }
function dayPct(ds)      { const d=pdi(pd(ds)); if(d<0) return 0; const P=PLAN[d]; return Math.round((P.exercises.filter((_,i)=>isDone(ds,i)).length/P.exercises.length)*100); }
function foodTotals(ds)  { return (S.food[ds]||[]).reduce((a,e)=>({cal:a.cal+e.cal,protein:a.protein+e.protein,carbs:a.carbs+e.carbs,fat:a.fat+e.fat}),{cal:0,protein:0,carbs:0,fat:0}); }
function goalMet(ds)     { const t=foodTotals(ds); return t.cal>=TARGETS.cal*.85&&t.cal<=TARGETS.cal*1.1&&t.protein>=TARGETS.protein*.9; }

/* ═══════════════════════════════════════════
   HAPTICS
═══════════════════════════════════════════ */
const vibe = (ms) => { try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} };
const H = {
  tick:   ()=>vibe(8),
  light:  ()=>vibe(13),
  medium: ()=>vibe(25),
  heavy:  ()=>vibe(40),
  done:   ()=>vibe([15,60,15,60,40]),
};

/* ═══════════════════════════════════════════
   REST TIMER
═══════════════════════════════════════════ */
let _timerEnd=null, _timerTotal=0, _raf=null;

function startTimer(secs) {
  _timerEnd=Date.now()+secs*1000; _timerTotal=secs;
  document.getElementById('timerBar').classList.add('on');
  H.medium(); tick();
}
function cancelTimer() {
  _timerEnd=null; document.getElementById('timerBar').classList.remove('on');
  if(_raf) cancelAnimationFrame(_raf);
}
function tick() {
  if(!_timerEnd) return;
  const rem=Math.max(0,Math.ceil((_timerEnd-Date.now())/1000));
  const m=Math.floor(rem/60), s=rem%60;
  document.getElementById('timerTime').textContent=`${m}:${String(s).padStart(2,'0')}`;
  document.getElementById('timerNum').textContent=rem;
  // Arc animation
  const pct = rem/_timerTotal;
  const circ = 113;
  document.getElementById('timerArc').style.strokeDashoffset = circ*(1-pct);
  if(rem<=0){
    cancelTimer(); H.done(); chime();
  } else {
    _raf=requestAnimationFrame(tick);
  }
}
function chime() {
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[0,.66],[.15,.88],[.3,1.1]].forEach(([t,f])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=660*f;
      g.gain.setValueAtTime(.25,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.18);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.2);
    });
  }catch(e){}
}

// Live filter — no network, instant results
let _results=[], _searchDs=null;

function doSearch(ds) {
  const q = (document.getElementById('fsearch')?.value||'').trim().toLowerCase();
  _searchDs = ds;
  if(!q || q.length < 2) {
    _results = [];
    render();
    return;
  }
  // Score each food by relevance
  const scored = FOOD_DB.map(f => {
    const name = f.name.toLowerCase();
    let score = 0;
    if(name.startsWith(q)) score = 100;
    else if(name.includes(q)) score = 50;
    else {
      const words = q.split(' ');
      const matches = words.filter(w => w.length>1 && name.includes(w));
      score = matches.length * 20;
    }
    return { ...f, score };
  }).filter(f => f.score > 0);
  scored.sort((a,b) => b.score - a.score);
  _results = scored.slice(0, 6);
  render();
}

function filterOnType(ds) {
  // Called on every keystroke for live filtering
  doSearch(ds);
}

function pickResult(ds, i) {
  const e = _results[i]; if(!e) return;
  if(!S.food[ds]) S.food[ds] = [];
  S.food[ds].push({name:e.name, cal:e.cal, protein:e.protein, carbs:e.carbs, fat:e.fat});
  _results = []; _searchDs = null;
  // Clear input
  const inp = document.getElementById('fsearch');
  if(inp) inp.value = '';
  H.medium(); persist(); render();
}

function addManual(ds){
  const n=document.getElementById('mfn')?.value?.trim();
  const c=parseInt(document.getElementById('mfc')?.value)||0;
  const p=parseInt(document.getElementById('mfp')?.value)||0;
  const cb=parseInt(document.getElementById('mfcb')?.value)||0;
  const f=parseInt(document.getElementById('mff')?.value)||0;
  if(!n||!c){ H.light(); return; }
  if(!S.food[ds]) S.food[ds]=[];
  S.food[ds].push({name:n,cal:c,protein:p,carbs:cb,fat:f});
  H.medium(); persist(); render();
}

function delFood(ds,i){
  if(S.food[ds]){ S.food[ds].splice(i,1); H.light(); persist(); render(); }
}

function rCal(){
  const t=now(), tk=dk(t), sel=S.sel||tk;
  const selD=pd(sel), di=pdi(selD), day=di>=0?PLAN[di]:null;
  const wn=wkn(selD), ac=day?day.color:"#1493FF", isT=sel===tk;
  const tdi=pdi(t), tday=tdi>=0?PLAN[tdi]:null, twn=wkn(t);

  let h=`<div style="padding-bottom:8px">`;

  // Today banner
  if(tday){
    h+=`<div class="today-banner">
      <div>
        <div class="today-eyebrow">Today · Week ${twn}</div>
        <div class="today-name">Day ${tday.n} — ${tday.label}</div>
        <div class="today-sub">${tday.sub}</div>
        <div class="today-date">${fmt(t)}</div>
      </div>
      ${!isT?`<button class="today-jump" onclick="jumpToday()">Today</button>`:''}
    </div>`;
  }

  // Calendar card
  h+=`<div class="cal-wrap">
    <div class="cal-header">
      <div class="cal-month">${MONTHS[S.calM]} ${S.calY}</div>
      <div class="cal-header-right">
        ${isT
          ?`<div class="cal-today-pill inactive">Today</div>`
          :`<button class="cal-today-pill" onclick="jumpToday()">Today</button>`}
        <button class="cal-nav-btn" onclick="prevM()">‹</button>
        <button class="cal-nav-btn" onclick="nextM()">›</button>
      </div>
    </div>
    <div class="cal-grid">`;

  DOW.forEach(d=>{ h+=`<div class="cal-dow">${d}</div>`; });

  const fd=new Date(S.calY,S.calM,1).getDay();
  const dim=new Date(S.calY,S.calM+1,0).getDate();
  for(let i=0;i<fd;i++) h+=`<div class="cal-tile empty"></div>`;

  for(let d=1;d<=dim;d++){
    const cd=new Date(S.calY,S.calM,d), ck=dk(cd);
    const cdi=pdi(cd), inP=cdi>=0, cDay=inP?PLAN[cdi]:null, cc=cDay?cDay.color:"#9BADC4";
    const isSel=ck===sel, isTc=ck===tk;
    const done=inP&&allDone(ck), pct=inP?dayPct(ck):0;
    let bg=inP?`${cc}18`:'transparent';
    let bc=inP?(isSel?cc:(isTc?`${cc}66`:'transparent')):'transparent';
    h+=`<div class="cal-tile${inP?'':' gone'}" style="background:${bg};border-color:${bc}" ${inP?`onclick="selDate('${ck}')"`:''}>`
      +`<div class="cal-num" style="color:${inP?cc:'var(--ink-4)'}">${d}</div>`;
    if(inP&&!cDay.rest) h+=`<div class="cal-dot" style="background:${pct>0?cc:`${cc}44`}"></div>`;
    if(done) h+=`<div class="cal-check" style="color:${cc}">✓</div>`;
    h+=`</div>`;
  }

  h+=`</div>`;

  // Legend
  h+=`<div class="cal-legend">`;
  const seen={};
  PLAN.forEach(p=>{ const k=p.color; if(seen[k]) return; seen[k]=1; h+=`<div class="legend-item"><div class="legend-pip" style="background:${p.color}"></div><div class="legend-txt">${p.abbr}</div></div>`; });
  h+=`</div></div>`;

  // Selected day
  if(day){
    const dp=dayPct(sel);
    h+=`<div class="day-hd" style="margin:12px 16px 0;background:${ac}18;border:1.5px solid ${ac}30">
      <div class="day-hd-eyebrow" style="color:${ac}">Week ${wn} · Day ${day.n}${isT?' · Today':''}</div>
      <div class="day-hd-name" style="color:${ac}">${day.label}</div>
      <div class="day-hd-sub" style="color:${ac}">${day.sub} · ${fmt(selD)}</div>`;
    if(!day.rest){
      h+=`<div class="day-hd-prog-row"><span class="day-hd-prog-label" style="color:${ac}">Progress</span><span class="day-hd-prog-pct" style="color:${ac}">${dp}%</span></div>
      <div class="prog-track"><div class="prog-bar" style="width:${dp}%;background:${ac}"></div></div>`;
    }
    if(dp===100) h+=`<div class="day-done" style="color:${ac}">Day complete 🔥</div>`;
    h+=`</div>`;

    // Exercise list
    h+=`<div class="ex-list">`;
    day.exercises.forEach((ex,ei)=>{
      const done=isDone(sel,ei), open=S.expanded===ei;
      const rem=_timerEnd?Math.max(0,Math.ceil((_timerEnd-Date.now())/1000)):null;
      h+=`<div class="ex-card${done?' done':''}" style="border-color:${done?`${ac}44`:'var(--border)'}">
        <div class="ex-row" onclick="expand(${ei})">
          <div class="ex-check${done?' ticked':''}" onclick="event.stopPropagation();tick_('${sel}',${ei})" style="${done?`background:${ac};border-color:${ac}`:`border-color:${ac}55;color:${ac}`}"></div>
          <div class="ex-name${done?' faded':''}">${ex.name}</div>
          <div class="ex-pill" style="background:${ex.cardio?'var(--bg-2)':ac+'18'};color:${ex.cardio?'var(--ink-3)':ac}">${ex.cardio?ex.reps:`${ex.sets}×${ex.reps}`}</div>
          <div class="ex-chev${open?' open':''}">▼</div>
        </div>`;
      if(open){
        h+=`<div class="ex-detail">`;
        if(ex.cardio){
          h+=`<div class="ex-tip">${tip(ex.name)}</div>`;
        } else {
          h+=`<div class="sets-hd">Scroll to set weight & reps</div><div class="sets-row">`;
          for(let si=0;si<ex.sets;si++){
            const wv=parseInt(S.logs[lkey(sel,ei,si,'w')])||0;
            const rv=parseInt(S.logs[lkey(sel,ei,si,'r')])||0;

              <div class="set-lbl">Set ${si+1}</div>

                    <div class="picker-list"></div>
                  </div>
                  <div class="picker-unit">lbs</div>
                </div>
                <div class="picker-wrap">
                  <div class="picker" id="${pid}-r" data-ds="${sel}" data-ei="${ei}" data-si="${si}" data-f="r" data-v="${rv}">
                    <div class="picker-sel-top"></div><div class="picker-sel-bot"></div>
                    <div class="picker-list"></div>
                  </div>
                  <div class="picker-unit">reps</div>
                </div>
              </div>
            </div>`;
          }
          h+=`</div>`;

  DOW.forEach(d=>{ h+=`<div class="cal-dow">${d}</div>`; });
  const fd2=new Date(S.foodCalY,S.foodCalM,1).getDay();
  const dim2=new Date(S.foodCalY,S.foodCalM+1,0).getDate();
  for(let i=0;i<fd2;i++) h+=`<div class="food-tile gone"></div>`;
  for(let d=1;d<=dim2;d++){
    const cd=new Date(S.foodCalY,S.foodCalM,d), ck=dk(cd);
    const fut=cd>t, isT2=ck===tk;
    const logged=(S.food[ck]||[]).length>0, met=goalMet(ck);
    let bg='transparent', bc='transparent', icon='', nc='var(--ink-4)';
    if(!fut&&logged){ bg=met?'var(--green-dim)':'var(--red-dim)'; bc=met?'var(--green)':'var(--red)'; icon=met?'✅':'⚠️'; nc=met?'var(--green)':'var(--red)'; }

    h+=`<div class="food-tile${fut?' gone':''}" style="background:${bg};border-color:${bc}" ${!fut?`onclick="selDate('${ck}');S.tab='cal';S.foodOpen=true;render()"`:''}>
      <div class="food-tile-num" style="color:${nc}">${d}</div>
      ${logged?`<div class="food-tile-icon">${icon}</div>`:''}

  h+=`</div>
    <div class="cal-legend" style="padding-top:8px">

    </div>

  // Weekly averages
  const wn2=wkn(t), dw=wn2>0?wn2:1;
  let wc=0,wp=0,wcb=0,wf=0,wd=0;
  for(let d=0;d<7;d++){
    const date=new Date(START); date.setDate(date.getDate()+(dw-1)*7+d);
    if(date>t) continue;
    const tot=foodTotals(dk(date));
    if(tot.cal>0){ wc+=tot.cal;wp+=tot.protein;wcb+=tot.carbs;wf+=tot.fat;wd++; }

  h+=`</div>`;
  return h;
}

function wkPct(wk){
  let t=0,c=0;
  for(let d=0;d<7;d++){
    const date=new Date(START); date.setDate(date.getDate()+(wk-1)*7+d);
    const ds2=dk(date);
    PLAN[d].exercises.forEach((_,ei)=>{ t++; if(isDone(ds2,ei)) c++; });
  }
  return Math.round((c/t)*100);
}

function rProg(){
  const t=now(), wn=wkn(t), dw=wn>0?wn:1;
  let h=`<div class="section">
    <div class="section-title">All 33 Weeks</div>
    <div class="wk-grid">`;
  for(let w=1;w<=WEEKS;w++){
    const p=wkPct(w), col=p===100?'var(--green)':p>0?'var(--orange)':'var(--ink-4)';
    h+=`<div class="wk-tile" onclick="jumpWeek(${w})"><div class="wk-tile-label">Wk ${w}</div><div class="wk-tile-pct" style="color:${col}">${p}%</div></div>`;

  h+=`</div>

  for(let d=0;d<7;d++){

      <div class="chip-row">`;
    pd2.exercises.forEach((_ex,ei)=>{
      const done2=isDone(ds2,ei), lbl=_ex.name.length>16?_ex.name.slice(0,14)+'…':_ex.name;

/* ═══════════════════════════════════════════
   RENDER: STRENGTH TAB
═══════════════════════════════════════════ */
function bwt(wk,di,ei){
  const date=new Date(START); date.setDate(date.getDate()+(wk-1)*7+di);
  const ds2=dk(date), ex=PLAN[di].exercises[ei]; if(ex.cardio) return null;
  let best=0;
  for(let si=0;si<ex.sets;si++){ const v=parseFloat(S.logs[lkey(ds2,ei,si,'w')]); if(!isNaN(v)&&v>best) best=v; }
  return best>0?best:null;
}

function rStr(){
  const lifts=PLAN.filter(p=>!p.rest), cw=wkn(now());
  let h=`<div class="section"><div class="section-title" style="margin-bottom:12px">Weight Progression</div>`;
  lifts.forEach(day=>{
    const di=PLAN.indexOf(day), exs=day.exercises.filter(e=>!e.cardio);
    h+=`<div style="margin-bottom:20px">
      <div class="str-day-hd" style="background:${day.color}14;border:1.5px solid ${day.color}28">

      </div>`;
    exs.forEach(ex=>{
      const ei=day.exercises.indexOf(ex), wts=[];
      for(let w=1;w<=WEEKS;w++) wts.push(bwt(w,di,ei));

      const gain=fw&&lw&&lw!==fw?lw-fw:null;
      h+=`<div class="str-ex-card"><div class="str-ex-name">${ex.name}</div>`;
      if(!lg.length){

        h+=`<div class="str-chart">`;
        wts.forEach((w,wi)=>{

          if(w) h+=`<div class="str-bar-wrap"><div class="str-bar" style="height:${ht}%;background:${day.color};opacity:${cur?1:.28}"></div></div>`;
          else  h+=`<div class="str-bar-wrap"><div class="str-bar-empty"></div></div>`;

        h+=`</div><div class="str-wk-row">`;
        for(let wi=0;wi<WEEKS;wi++){ const cur=(wi+1)===cw; h+=`<div class="str-wk-lbl" style="color:${cur?day.color:'var(--ink-4)'}">${wi%4===0?`W${wi+1}`:''}</div>`; }
        h+=`</div><div class="str-stats">
          <div class="str-stat"><div class="str-stat-val" style="color:${day.color}">${fw??'—'}</div><div class="str-stat-lbl">Start</div></div>

          <div class="str-stat"><div class="str-stat-val" style="color:${day.color}">${lw??'—'}</div><div class="str-stat-lbl">Latest</div></div>

        if(gain!==null) h+=`<div class="str-gain" style="color:${gain>0?'var(--green)':'var(--red)'}">${gain>0?'▲':'▼'} ${Math.abs(gain)} lbs ${gain>0?'gained':'lost'} since Week 1</div>`;
      }
      h+=`</div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;
  return h;

/* ═══════════════════════════════════════════
   SCROLL PICKER ENGINE
═══════════════════════════════════════════ */
const LBS=[],REPS=[],IH=40;
for(let v=0;v<=300;v+=5) LBS.push(v);
for(let v=0;v<=50;v++)   REPS.push(v);

function buildList(el,vals,cur){
  const list=el.querySelector('.picker-list');
  list.innerHTML='';
  vals.forEach(v=>{ const i=document.createElement('div'); i.className='picker-item'+(v===cur?' on':''); i.textContent=v; list.appendChild(i); });
  list.style.transform=`translateY(${-vals.indexOf(cur)*IH}px)`;
}
function getOff(el){ return new DOMMatrix(el.querySelector('.picker-list').style.transform).m42; }
function snap(el,vals,ds,ei,si,f){
  const list=el.querySelector('.picker-list');
  let idx=Math.max(0,Math.min(Math.round(-getOff(el)/IH),vals.length-1));
  list.style.transition=`transform 200ms cubic-bezier(.25,.46,.45,.94)`;
  list.style.transform=`translateY(${-idx*IH}px)`;
  list.querySelectorAll('.picker-item').forEach((x,i)=>x.classList.toggle('on',i===idx));
  S.logs[lkey(ds,ei,si,f)]=String(vals[idx]);
  H.tick(); persist();
}

function initPickers(){
  document.querySelectorAll('.picker').forEach(el=>{
    if(el.dataset.ready) return; el.dataset.ready='1';
    const f=el.dataset.f, ds=el.dataset.ds;
    const ei=parseInt(el.dataset.ei), si=parseInt(el.dataset.si);
    const vals=f==='w'?LBS:REPS;
    const stored=parseInt(S.logs[lkey(ds,ei,si,f)])||0;
    const cur=vals.includes(stored)?stored:vals[0];
    buildList(el,vals,cur);
    const list=el.querySelector('.picker-list');
    let sy=0,ly=0,so=0,drag=false,vel=0,lt=0;

    el.addEventListener('touchstart',e=>{
      e.preventDefault();
      list.style.transition='none';
      sy=e.touches[0].clientY; ly=sy; so=getOff(el); drag=true; vel=0; lt=Date.now();
    },{passive:false});

    el.addEventListener('touchmove',e=>{
      if(!drag) return; e.preventDefault();
      const y=e.touches[0].clientY, now=Date.now();
      vel=(y-ly)/(now-lt+1); ly=y; lt=now;
      const no=Math.max(-(vals.length-1)*IH,Math.min(0,so+(y-sy)));
      list.style.transform=`translateY(${no}px)`;
      const idx=Math.round(-no/IH);
      list.querySelectorAll('.picker-item').forEach((x,i)=>x.classList.toggle('on',i===idx));
    },{passive:false});

    el.addEventListener('touchend',()=>{
      if(!drag) return; drag=false;
      const proj=getOff(el)+vel*80;
      const clamped=Math.max(-(vals.length-1)*IH,Math.min(0,proj));
      list.style.transition='transform 200ms ease';
      list.style.transform=`translateY(${clamped}px)`;
      setTimeout(()=>snap(el,vals,ds,ei,si,f),205);
    });

    el.addEventListener('wheel',e=>{
      e.preventDefault();
      list.style.transition='none';
      const no=Math.max(-(vals.length-1)*IH,Math.min(0,getOff(el)-Math.sign(e.deltaY)*IH));
      list.style.transform=`translateY(${no}px)`;
      setTimeout(()=>snap(el,vals,ds,ei,si,f),55);
    },{passive:false});
  });
}

/* ═══════════════════════════════════════════
   ACTIONS
═══════════════════════════════════════════ */
function switchTab(t){ S.tab=t; S.expanded=null; S.foodOpen=false; H.light(); render(); }
function toggleDark(){ S.dark=!S.dark; document.body.classList.toggle('dark',S.dark); persist(); render(); }
function prevM()   { S.calM===0?(S.calM=11,S.calY--):S.calM--; render(); }
function nextM()   { S.calM===11?(S.calM=0,S.calY++):S.calM++; render(); }
function prevFM()  { S.foodCalM===0?(S.foodCalM=11,S.foodCalY--):S.foodCalM--; render(); }
function nextFM()  { S.foodCalM===11?(S.foodCalM=0,S.foodCalY++):S.foodCalM++; render(); }
function selDate(ds){ S.sel=ds; S.expanded=null; render(); }
function jumpToday(){ const t=now(); S.calY=t.getFullYear(); S.calM=t.getMonth(); S.sel=dk(t); S.expanded=null; render(); }
function jumpWeek(w){ const d=new Date(START); d.setDate(d.getDate()+(w-1)*7); S.calY=d.getFullYear(); S.calM=d.getMonth(); S.sel=dk(d); S.tab='cal'; S.expanded=null; render(); }
function expand(ei){ S.expanded=S.expanded===ei?null:ei; H.light(); render(); }
function tick_(ds,ei){ const k=dkey(ds,ei); S.done[k]=!S.done[k]; H.medium(); persist(); render(); }

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
boot();
render();
</script>
